name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - all
          - backend
          - worker
          - frontend

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: launchpadai

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: inputs.service == 'all' || inputs.service == 'backend'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/launchpadai-backend:${{ github.sha }} ./backend
          docker push ${{ env.ECR_REGISTRY }}/launchpadai-backend:${{ github.sha }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service backend \
            --force-new-deployment

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: inputs.service == 'all' || inputs.service == 'worker'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push worker image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/launchpadai-worker:${{ github.sha }} ./backend
          docker push ${{ env.ECR_REGISTRY }}/launchpadai-worker:${{ github.sha }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service worker \
            --force-new-deployment

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: inputs.service == 'all' || inputs.service == 'frontend'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.PRODUCTION_API_URL }} \
            -t ${{ env.ECR_REGISTRY }}/launchpadai-frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ env.ECR_REGISTRY }}/launchpadai-frontend:${{ github.sha }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service frontend \
            --force-new-deployment
